<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Acionar - Gestão de Clientes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    spacing: { 'safe-bottom': 'env(safe-area-inset-bottom)', 'safe-top': 'env(safe-area-inset-top)' }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="min-h-[100dvh] bg-slate-50 text-slate-800 transition-colors duration-300 dark:bg-[#020617] dark:text-slate-100 flex flex-col">

    <!-- Header Principal -->
    <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 bg-white/80 pt-safe-top backdrop-blur-xl transition-colors duration-300 dark:border-slate-800/80 dark:bg-[#020617]/80">
        <div class="px-4 sm:px-6 py-3.5 max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-white font-black text-lg shadow-md shadow-blue-500/20">
                    A
                </div>
                <div class="flex flex-col">
                    <span class="text-[0.65rem] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Cadastros</span>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white sm:text-xl">Base de Clientes</h1>
                </div>
            </div>

            <!-- Navegação Desktop & Controles -->
            <div class="flex items-center gap-2 sm:gap-3">
                <nav class="hidden md:flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-2xl border border-slate-200/60 dark:border-slate-800">
                    <a href="./dashboard.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Agenda</a>
                    <a href="./clientes.html" class="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-blue-600 text-blue-600 dark:text-white shadow-sm">Clientes</a>
                    <a href="./servicos.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Serviços</a>
                </nav>

                <button id="theme-toggle" aria-label="Alternar Tema" class="flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 shadow-sm">
                    <i id="theme-toggle-dark-icon" data-lucide="moon" class="hidden h-5 w-5"></i>
                    <i id="theme-toggle-light-icon" data-lucide="sun" class="hidden h-5 w-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 overflow-y-auto pb-28 md:pb-10">
        <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">

            <!-- Banner com busca e botão novo cliente -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900/60 p-5 sm:p-6 rounded-[2.5rem] shadow-sm border border-slate-200/80 dark:border-slate-800 backdrop-blur-md">
                <div>
                    <span class="text-xs font-extrabold uppercase tracking-wider text-blue-600 dark:text-blue-400">Contatos</span>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-slate-100">Gerenciar Clientes</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Visualize os contatos cadastrados no Supabase.</p>
                </div>

                <button id="btnOpenClientModal" class="w-full sm:w-auto flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 px-6 py-3.5 text-sm font-bold text-white shadow-lg shadow-blue-500/25 transition-all transform active:scale-95">
                    <i data-lucide="user-plus" class="h-5 w-5"></i>
                    <span>Novo Cliente</span>
                </button>
            </div>

            <!-- Lista de Clientes -->
            <section class="rounded-[2.5rem] bg-white dark:bg-slate-900/60 shadow-sm border border-slate-200/80 dark:border-slate-800 overflow-hidden backdrop-blur-md">
                <div id="clientesContainer" class="p-2 sm:p-4 divide-y divide-slate-100 dark:divide-slate-800/60">
                    <!-- Preenchido via JS do Supabase -->
                </div>
            </section>

        </div>
    </main>

    <!-- Menu Inferior Mobile -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-slate-200/80 bg-white/90 pb-safe-bottom backdrop-blur-xl dark:border-slate-800/80 dark:bg-[#020617]/90 md:hidden">
        <div class="flex h-16 items-center justify-around px-2">
            <a href="./dashboard.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                <i data-lucide="calendar" class="h-5 w-5"></i>
                <span class="text-[10px]">Agenda</span>
            </a>
            <a href="./clientes.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-blue-600 dark:text-blue-400 font-bold">
                <i data-lucide="users" class="h-5 w-5"></i>
                <span class="text-[10px]">Clientes</span>
            </a>
            <a href="./servicos.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                <i data-lucide="scissors" class="h-5 w-5"></i>
                <span class="text-[10px]">Serviços</span>
            </a>
        </div>
    </nav>

    <!-- Modal Novo Cliente -->
    <div id="modalCliente" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/70 backdrop-blur-sm hidden p-0 sm:p-4 overflow-y-auto">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-t-[2.5rem] sm:rounded-[2.5rem] w-full max-w-md p-6 sm:p-8 shadow-2xl space-y-5 my-0 sm:my-auto">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800/80 pb-3">
                <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <i data-lucide="user-plus" class="h-5 w-5 text-blue-500"></i>
                    Cadastrar Novo Cliente
                </h3>
                <button id="btnCloseClientModal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>

            <form id="formNovoCliente" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Nome Completo</label>
                    <input type="text" id="newNome" required placeholder="Ex: Maria Oliveira" class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">WhatsApp</label>
                    <input type="tel" id="newWhatsapp" required placeholder="(11) 99999-9999" class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" id="btnCancelClientModal" class="px-5 py-2.5 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">Cancelar</button>
                    <button type="submit" class="px-6 py-2.5 rounded-full text-xs font-extrabold bg-blue-600 text-white hover:bg-blue-500 shadow-md">Salvar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initTheme, showToast, applyPhoneMask, cleanPhone, fetchAndRenderClientes } from './js/app.js';
        import { supabase } from './js/supabase.js';

        initTheme();

        const modal = document.getElementById('modalCliente');
        const openBtn = document.getElementById('btnOpenClientModal');
        const closeBtn = document.getElementById('btnCloseClientModal');
        const cancelBtn = document.getElementById('btnCancelClientModal');
        const form = document.getElementById('formNovoCliente');
        const whatsappInput = document.getElementById('newWhatsapp');

        applyPhoneMask(whatsappInput);

        openBtn?.addEventListener('click', () => modal.classList.remove('hidden'));
        const closeModal = () => modal.classList.add('hidden');
        closeBtn?.addEventListener('click', closeModal);
        cancelBtn?.addEventListener('click', closeModal);

        form?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('newNome').value.trim();
            const whatsapp = cleanPhone(document.getElementById('newWhatsapp').value);

            try {
                const { error } = await supabase.from('clientes').insert([{ nome, whatsapp }]);
                if (error) throw error;
                showToast('Cliente cadastrado com sucesso!', 'success');
                closeModal();
                form.reset();
                await fetchAndRenderClientes('clientesContainer');
            } catch (err) {
                showToast('Erro ao cadastrar cliente: ' + err.message, 'error');
            }
        });

        await fetchAndRenderClientes('clientesContainer');
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
