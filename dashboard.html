<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>eStocking - Dashboard / Agenda</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    spacing: { 'safe-bottom': 'env(safe-area-inset-bottom)', 'safe-top': 'env(safe-area-inset-top)' }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="min-h-[100dvh] bg-slate-50 text-slate-800 transition-colors duration-300 dark:bg-[#020617] dark:text-slate-100 flex flex-col">
    
    <!-- Header -->
    <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 bg-white/70 pt-safe-top backdrop-blur-xl transition-colors duration-300 dark:border-slate-800/80 dark:bg-[#020617]/70">
        <div class="px-5 py-4 max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex flex-col">
                <span class="text-[0.65rem] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Painel Principal</span>
                <h1 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-white sm:text-2xl">Agendamentos</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <span id="userLabelDesktop" class="hidden text-xs font-medium text-slate-500 dark:text-slate-400 md:inline-block"></span>
                <button id="theme-toggle" class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400">
                    <i id="theme-toggle-dark-icon" data-lucide="moon" class="hidden h-5 w-5"></i>
                    <i id="theme-toggle-light-icon" data-lucide="sun" class="hidden h-5 w-5"></i>
                </button>
                <button id="btnLogout" class="hidden md:flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400 hover:text-red-500 transition-colors">
                    <i data-lucide="log-out" class="h-5 w-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 overflow-y-auto pb-28 md:pb-8">
        <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            <div class="flex justify-between items-center bg-white p-4 sm:p-6 rounded-[2rem] shadow-sm ring-1 ring-slate-200 dark:bg-slate-900/40 dark:ring-slate-800">
                <div>
                    <h2 class="text-base font-semibold text-slate-900 dark:text-slate-100">Gerenciar Agenda</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400">Visualize e crie compromissos</p>
                </div>
                <button class="flex items-center justify-center gap-2 rounded-full bg-slate-900 px-5 py-3 text-sm font-medium text-white dark:bg-white dark:text-slate-900 hover:opacity-90 transition-opacity">
                    <i data-lucide="plus" class="h-4 w-4"></i>
                    Novo Agendamento
                </button>
            </div>

            <section class="rounded-[2rem] bg-white shadow-sm ring-1 ring-slate-200 overflow-hidden dark:bg-slate-900/40 dark:ring-slate-800">
                <div id="agendamentosContainer" class="divide-y divide-slate-100 dark:divide-slate-800/60 p-6">
                    <div class="flex flex-col items-center justify-center py-12 px-4 text-center">
                        <div class="h-12 w-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mb-3 dark:bg-slate-800 dark:text-slate-500">
                            <i data-lucide="calendar" class="h-6 w-6"></i>
                        </div>
                        <p class="text-sm font-medium text-slate-900 dark:text-slate-200">Nenhum agendamento encontrado</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Menu inferior (Mobile) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-slate-200/80 bg-white/80 pb-safe-bottom backdrop-blur-xl dark:border-slate-800/80 dark:bg-[#020617]/80 md:hidden">
        <div class="flex h-16 items-center justify-around px-2">
            <a href="./dashboard.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-blue-600 dark:text-blue-400">
                <i data-lucide="calendar" class="h-5 w-5"></i>
                <span class="text-[10px] font-medium">Agenda</span>
            </a>
            <a href="./clientes.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500">
                <i data-lucide="users" class="h-5 w-5"></i>
                <span class="text-[10px] font-medium">Clientes</span>
            </a>
            <button id="bottomLogout" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500 hover:text-red-500">
                <i data-lucide="log-out" class="h-5 w-5"></i>
                <span class="text-[10px] font-medium">Sair</span>
            </button>
        </div>
    </nav>

    <!-- MODAL NOVO AGENDAMENTO -->
    <div id="modalAgendamento" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4 overflow-y-auto">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[2rem] w-full max-w-lg p-6 shadow-2xl space-y-6 my-auto max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
                <h3 class="text-lg font-semibold text-slate-900 dark:text-white">Novo Agendamento</h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>
            
            <form id="formAgendamento" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Nome do Cliente</label>
                    <input type="text" id="inputCliente" required class="w-full rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Serviço / Descrição</label>
                    <input type="text" id="inputServico" required class="w-full rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Data</label>
                        <input type="date" id="inputData" required class="w-full rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Hora</label>
                        <input type="time" id="inputHora" required class="w-full rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" id="btnCancelModal" class="px-5 py-2.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">Cancelar</button>
                    <button type="submit" class="px-6 py-2.5 rounded-full text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 shadow-lg shadow-blue-600/20">Salvar Agendamento</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // Lógica de Alternância de Tema (Dark/Light)
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            } else {
                lightIcon.classList.add('hidden');
                darkIcon.classList.remove('hidden');
            }
        }
        updateThemeIcons();

        themeToggleBtn.addEventListener('click', function() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
            updateThemeIcons();
        });

        // Configuração do Supabase
        const SUPABASE_URL = '__SUPABASE_URL__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
        
        const safeUrl = SUPABASE_URL === '__SUPABASE_URL__' ? 'https://preview-mock.supabase.co' : SUPABASE_URL;
        const supabase = createClient(safeUrl, SUPABASE_ANON_KEY);

        // Autenticação
        try {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                console.log("Sessão não encontrada. (Redirecionamento evitado para visualização)");
            } else {
                const userLabel = session.user.email || 'Usuário';
                const desktopLabel = document.getElementById('userLabelDesktop');
                if(desktopLabel) desktopLabel.textContent = userLabel;
            }
        } catch (error) {
            console.warn("Modo Preview: Ignorando erro de autenticação pois as credenciais são placeholders.");
        }

        // Logout
        const handleLogout = async () => {
            await supabase.auth.signOut();
            window.location.href = './index.html';
        };

        document.getElementById('btnLogout')?.addEventListener('click', handleLogout);
        document.getElementById('bottomLogout')?.addEventListener('click', handleLogout);

        // Controle do Modal de Novo Agendamento
        const modal = document.getElementById('modalAgendamento');
        const openModalBtn = document.querySelector('button.bg-slate-900, button.dark\\:bg-white');
        const closeModalBtn = document.getElementById('btnCloseModal');
        const cancelModalBtn = document.getElementById('btnCancelModal');

        openModalBtn?.addEventListener('click', () => modal.classList.remove('hidden'));
        closeModalBtn?.addEventListener('click', () => modal.classList.add('hidden'));
        cancelModalBtn?.addEventListener('click', () => modal.classList.add('hidden'));

        // Salvar Novo Agendamento no Supabase
        document.getElementById('formAgendamento')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const cliente = document.getElementById('inputCliente').value;
            const servico = document.getElementById('inputServico').value;
            const data = document.getElementById('inputData').value;
            const hora = document.getElementById('inputHora').value;
            const data_hora = `${data}T${hora}:00`;

            try {
                const { error } = await supabase.from('agendamentos').insert([{ cliente, servico, data_hora, status: 'Pendente' }]);
                if (error) throw error;
                
                alert('Agendamento criado com sucesso!');
                modal.classList.add('hidden');
                window.location.reload();
            } catch (err) {
                console.error(err);
                alert('Erro ao salvar agendamento. Verifique se a tabela "agendamentos" existe no Supabase.');
            }
        });

        // Inicializa Ícones do Lucide
        lucide.createIcons();
    </script>
</body>
</html>
