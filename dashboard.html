<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eStocking - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: dark; }
        body { background-color: #020617; }
    </style>
</head>
<body class="min-h-screen text-slate-100 bg-slate-950">
    <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-30 border-b border-slate-800/70 bg-slate-950/95 backdrop-blur-xl px-4 py-4 shadow-sm md:px-8">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-xs uppercase tracking-[0.3em] text-slate-500">Bem-vindo ao painel</p>
                    <h1 class="mt-2 text-2xl font-semibold text-white sm:text-3xl">Visão geral dos agendamentos</h1>
                </div>
                <button id="btnLogoutMobile" class="inline-flex items-center gap-2 rounded-3xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm font-semibold text-rose-300 transition hover:bg-rose-500/20 md:hidden">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    Sair
                </button>
            </div>

            <div class="mt-4 grid gap-3 sm:grid-cols-[1.2fr_auto]">
                <div class="rounded-3xl border border-slate-800/80 bg-slate-900/80 px-4 py-4 text-sm text-slate-300 shadow-sm">
                    <p class="text-[0.65rem] uppercase tracking-[0.25em] text-slate-500">Usuário</p>
                    <p id="userLabel" class="mt-2 text-lg font-semibold text-white truncate">Carregando...</p>
                </div>
                <button id="btnLogout" class="hidden md:inline-flex items-center gap-2 rounded-3xl border border-rose-500/30 bg-rose-500/10 px-4 py-4 text-sm font-semibold text-rose-300 transition hover:bg-rose-500/20">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    Sair
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto pb-28 md:pb-8">
            <section class="px-4 py-5 sm:px-6">
                <div class="grid gap-4 sm:grid-cols-3">
                    <article class="rounded-[28px] border border-slate-800/80 bg-slate-900/80 p-5 shadow-md shadow-slate-950/20">
                        <div class="flex items-center justify-between text-slate-400 mb-3">
                            <span class="text-xs uppercase tracking-[0.2em]">Hoje</span>
                            <i data-lucide="calendar-check" class="w-5 h-5 text-sky-400"></i>
                        </div>
                        <p id="statToday" class="text-4xl font-semibold text-white">0</p>
                    </article>
                    <article class="rounded-[28px] border border-slate-800/80 bg-slate-900/80 p-5 shadow-md shadow-slate-950/20">
                        <div class="flex items-center justify-between text-slate-400 mb-3">
                            <span class="text-xs uppercase tracking-[0.2em]">Pendentes</span>
                            <i data-lucide="clock" class="w-5 h-5 text-amber-400"></i>
                        </div>
                        <p id="statPending" class="text-4xl font-semibold text-white">0</p>
                    </article>
                    <article class="rounded-[28px] border border-slate-800/80 bg-slate-900/80 p-5 shadow-md shadow-slate-950/20">
                        <div class="flex items-center justify-between text-slate-400 mb-3">
                            <span class="text-xs uppercase tracking-[0.2em]">Total mês</span>
                            <i data-lucide="trending-up" class="w-5 h-5 text-emerald-400"></i>
                        </div>
                        <p id="statTotal" class="text-4xl font-semibold text-white">0</p>
                    </article>
                </div>

                <div class="mt-6 rounded-[32px] border border-slate-800/80 bg-slate-900/80 shadow-md shadow-slate-950/20 overflow-hidden">
                    <div class="flex flex-col gap-3 border-b border-slate-800/80 p-5 sm:flex-row sm:items-center sm:justify-between">
                        <div>
                            <p class="text-sm font-semibold text-slate-200">Próximos registros</p>
                            <p class="mt-1 text-sm text-slate-400">Visão rápida dos agendamentos futuros</p>
                        </div>
                        <button class="inline-flex items-center justify-center gap-2 rounded-3xl bg-gradient-to-r from-sky-500 to-indigo-600 px-4 py-3 text-sm font-semibold text-white transition hover:opacity-95">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Novo agendamento
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-[680px] w-full text-left text-sm text-slate-300 border-collapse">
                            <thead class="bg-slate-950/90 text-slate-500">
                                <tr>
                                    <th class="px-4 py-4 font-medium">Cliente / Item</th>
                                    <th class="px-4 py-4 font-medium">Data e Hora</th>
                                    <th class="px-4 py-4 font-medium">Status</th>
                                    <th class="px-4 py-4 text-right font-medium">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="agendamentosTableBody" class="divide-y divide-slate-800/70">
                                <tr>
                                    <td class="px-4 py-5 text-slate-500" colspan="4">Nenhum agendamento encontrado.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-30 flex items-center justify-between gap-2 border-t border-slate-800/70 bg-slate-950/95 px-4 py-3 shadow-[0_-24px_48px_-36px_rgba(15,23,42,0.9)] md:hidden">
        <button class="flex flex-1 flex-col items-center rounded-3xl bg-slate-900/90 px-3 py-2 text-slate-200 transition hover:bg-slate-900">
            <i data-lucide="calendar" class="w-5 h-5"></i>
            <span class="text-[11px]">Agenda</span>
        </button>
        <button class="flex flex-1 flex-col items-center rounded-3xl bg-slate-900/90 px-3 py-2 text-slate-200 transition hover:bg-slate-900">
            <i data-lucide="users" class="w-5 h-5"></i>
            <span class="text-[11px]">Cadastros</span>
        </button>
        <button id="bottomLogout" class="flex flex-1 flex-col items-center rounded-3xl bg-rose-500/10 px-3 py-2 text-rose-300 transition hover:bg-rose-500/20">
            <i data-lucide="log-out" class="w-5 h-5"></i>
            <span class="text-[11px]">Sair</span>
        </button>
    </nav>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = '__SUPABASE_URL__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            window.location.href = './index.html';
        }

        document.getElementById('userLabel').textContent = session.user.email || 'Usuário';

        const handleLogout = async () => {
            await supabase.auth.signOut();
            window.location.href = './index.html';
        };

        document.getElementById('btnLogout')?.addEventListener('click', handleLogout);
        document.getElementById('btnLogoutMobile')?.addEventListener('click', handleLogout);
        document.getElementById('bottomLogout')?.addEventListener('click', handleLogout);

        lucide.createIcons();
    </script>
</body>
</html>
