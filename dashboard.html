<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - eStocking</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col md:flex-row h-screen overflow-hidden">

    <!-- 1. MENU LATERAL (Responsivo: Esconde no mobile e vira barra inferior fixa ou drawer) -->
    <aside class="w-full md:w-64 bg-slate-900 border-t md:border-t-0 md:border-r border-slate-800 flex md:flex-col justify-between order-last md:order-first z-20">
        <div class="hidden md:flex h-16 items-center px-6 border-b border-slate-800">
            <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">eStocking</span>
        </div>
        
        <!-- Navegação (No mobile fica em linha horizontal na parte inferior da tela) -->
        <nav class="flex md:flex-col justify-around md:justify-start p-2 md:p-4 w-full md:space-y-1">
            <a href="#" class="flex flex-col md:flex-row items-center gap-1 md:gap-3 px-3 md:px-4 py-2.5 rounded-lg bg-indigo-600/10 text-indigo-400 font-medium text-xs md:text-sm transition">
                <i data-lucide="calendar" class="w-5 h-5"></i> <span>Agenda</span>
            </a>
            <a href="#" class="flex flex-col md:flex-row items-center gap-1 md:gap-3 px-3 md:px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 text-xs md:text-sm transition">
                <i data-lucide="users" class="w-5 h-5"></i> <span>Cadastros</span>
            </a>
            <a href="#" class="flex flex-col md:flex-row items-center gap-1 md:gap-3 px-3 md:px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 text-xs md:text-sm transition">
                <i data-lucide="sliders" class="w-5 h-5"></i> <span>Parâmetros</span>
            </a>
            <a href="#" class="flex flex-col md:flex-row items-center gap-1 md:gap-3 px-3 md:px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 text-xs md:text-sm transition">
                <i data-lucide="settings" class="w-5 h-5"></i> <span>Ajustes</span>
            </a>
        </nav>

        <!-- Botão Sair (Oculto no rodapé mobile para economizar espaço, mas acessível) -->
        <div class="hidden md:block p-4 border-t border-slate-800">
            <button id="btnLogout" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-rose-400 hover:bg-rose-500/10 transition font-medium text-sm">
                <i data-lucide="log-out" class="w-5 h-5"></i> Sair
            </button>
        </div>
    </aside>

    <!-- 2. CONTEÚDO PRINCIPAL -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <!-- Topbar Mobile-Friendly -->
        <header class="h-16 bg-slate-900/50 backdrop-blur border-b border-slate-800 flex items-center justify-between px-4 md:px-8 sticky top-0 z-10">
            <h1 class="text-base md:text-lg font-semibold text-slate-200 truncate">Agendamentos</h1>
            <div class="flex items-center gap-3">
                <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 md:px-4 py-2 rounded-lg text-xs md:text-sm font-medium transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span class="hidden sm:inline">Novo Agendamento</span><span class="sm:hidden">Novo</span>
                </button>
                <button id="btnLogoutMobile" class="md:hidden text-rose-400 p-2 hover:bg-rose-500/10 rounded-lg">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Corpo da Página -->
        <div class="p-4 md:p-8 space-y-6 pb-20 md:pb-8">
            
            <!-- Cards de Métricas (Empilhados no mobile, lado a lado no PC) -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-6">
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between text-slate-400 mb-2">
                        <span class="text-xs md:text-sm font-medium">Hoje</span>
                        <i data-lucide="calendar-check" class="w-5 h-5 text-indigo-400"></i>
                    </div>
                    <div class="text-2xl md:text-3xl font-bold text-slate-100" id="statToday">0</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between text-slate-400 mb-2">
                        <span class="text-xs md:text-sm font-medium">Pendentes</span>
                        <i data-lucide="clock" class="w-5 h-5 text-amber-400"></i>
                    </div>
                    <div class="text-2xl md:text-3xl font-bold text-slate-100" id="statPending">0</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between text-slate-400 mb-2">
                        <span class="text-xs md:text-sm font-medium">Total Mês</span>
                        <i data-lucide="trending-up" class="w-5 h-5 text-emerald-400"></i>
                    </div>
                    <div class="text-2xl md:text-3xl font-bold text-slate-100" id="statTotal">0</div>
                </div>
            </div>

            <!-- Tabela Responsiva com Scroll Horizontal Suave -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                <div class="p-4 md:p-6 border-b border-slate-800 flex items-center justify-between">
                    <h2 class="font-semibold text-slate-200 text-sm md:text-base">Próximos Registros</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs md:text-sm">
                        <thead>
                            <tr class="bg-slate-900/80 text-slate-400 border-b border-slate-800">
                                <th class="p-3 md:p-4 font-medium">Cliente / Item</th>
                                <th class="p-3 md:p-4 font-medium">Data e Hora</th>
                                <th class="p-3 md:p-4 font-medium">Status</th>
                                <th class="p-3 md:p-4 text-right font-medium">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="agendamentosTableBody" class="divide-y divide-slate-800/50 text-slate-300">
                            <tr>
                                <td colspan="4" class="p-6 text-center text-slate-500">Nenhum agendamento encontrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Script de Integração e Controle -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = '__SUPABASE_URL__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Validar Sessão
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            window.location.href = './index.html';
        }

        // Ação de Logout (Desktop e Mobile)
        const handleLogout = async () => {
            await supabase.auth.signOut();
            window.location.href = './index.html';
        };
        
        document.getElementById('btnLogout')?.addEventListener('click', handleLogout);
        document.getElementById('btnLogoutMobile')?.addEventListener('click', handleLogout);

        // Inicializa os ícones
        lucide.createIcons();
    </script>
</body>
</html>
