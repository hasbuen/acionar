<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eStocking - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: dark; }
        body { background-color: #020617; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[radial-gradient(circle_at_top,_rgba(56,189,248,0.18),_transparent_28%),radial-gradient(circle_at_bottom_right,_rgba(129,140,248,0.16),_transparent_25%),#020617] px-4 py-8 text-slate-100">
    <div class="w-full max-w-md overflow-hidden rounded-[36px] border border-slate-800/70 bg-slate-950/95 shadow-[0_40px_120px_-60px_rgba(15,23,42,0.9)] backdrop-blur-xl">
        <div class="bg-slate-900/95 px-8 py-10 text-center">
  
            <h1 class="text-4xl font-semibold text-white">Acionar</h1>
            <p class="mx-auto mt-3 max-w-sm text-sm leading-6 text-slate-400">Acesse ao seu ambiente de controle de agendamentos.</p>
        </div>

        <div class="px-8 py-8">
            <div id="error-message" class="hidden rounded-3xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200"></div>

            <form id="login-form" class="space-y-5">
                <div class="space-y-2">
                    <label for="email" class="text-sm font-medium text-slate-300">E-mail</label>
                    <input id="email" name="email" type="email" required placeholder="Digite seu e-mail"
                        class="w-full rounded-[28px] border border-slate-800/80 bg-slate-950 px-4 py-3 text-slate-100 placeholder:text-slate-500 transition focus:border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500/20" />
                </div>

                <div class="space-y-2">
                    <label for="password" class="text-sm font-medium text-slate-300">Senha</label>
                    <input id="password" name="password" type="password" required placeholder="Digite sua senha"
                        class="w-full rounded-[28px] border border-slate-800/80 bg-slate-950 px-4 py-3 text-slate-100 placeholder:text-slate-500 transition focus:border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500/20" />
                </div>

                <button id="submit-btn" type="submit"
                    class="w-full rounded-[28px] bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-500/20 transition duration-200 hover:scale-[1.01] hover:shadow-sky-500/30 flex items-center justify-center gap-2">
                    <i data-lucide="arrow-right" class="h-4 w-4"></i>
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = '__SUPABASE_URL__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = './dashboard.html';
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            showError('');
            errorMessage.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Entrando...';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                showError('Falha na autenticação: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Entrar no Painel';
                return;
            }

            window.location.href = './dashboard.html';
        });

        await checkSession();
        lucide.createIcons();
    </script>
</body>
</html>
