<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Acionar">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <title>Acionar - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    spacing: { 'safe-bottom': 'env(safe-area-inset-bottom)', 'safe-top': 'env(safe-area-inset-top)' }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .btn-animated {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-animated:hover {
            transform: translateY(-2px) scale(1.03);
        }
        .btn-animated:active {
            transform: translateY(0) scale(0.96);
        }
        html:not(.dark) select option {
            background-color: #ffffff;
            color: #0f172a;
            padding: 10px;
        }
        html.dark select option {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 10px;
        }
    </style>
</head>
<body class="min-h-[100dvh] bg-[#e8eef6] text-slate-900 transition-colors duration-300 dark:bg-[#020617] dark:text-slate-100 flex flex-col items-center justify-center p-4">

    <!-- Header superior com modo escuro -->
    <header class="w-full max-w-md mx-auto flex items-center justify-between pt-safe-top">
        <div class="flex items-center gap-2">
            <div class="h-9 w-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-white shadow-lg shadow-blue-500/20 font-black text-lg">
                A
            </div>
            <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Acionar</span>
        </div>

        <button id="theme-toggle" class="flex h-10 w-10 items-center justify-center rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 shadow-sm">
            <i id="theme-toggle-dark-icon" data-lucide="moon" class="hidden h-5 w-5"></i>
            <i id="theme-toggle-light-icon" data-lucide="sun" class="hidden h-5 w-5"></i>
        </button>
    </header>

    <!-- Card Principal de Login -->
    <main class="w-full max-w-md mx-auto my-auto py-6">
        <div class="overflow-hidden rounded-[2.5rem] border border-slate-200/80 bg-white/90 dark:border-slate-800/80 dark:bg-slate-950/80 shadow-2xl backdrop-blur-xl p-6 sm:p-8 space-y-6">
            
            <div class="text-center space-y-2">
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Acesse o Painel</h1>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 leading-relaxed">Ambiente seguro para controle de agendamentos e clientes.</p>
            </div>

            <div id="error-message" class="hidden rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-xs sm:text-sm text-rose-600 dark:text-rose-300 flex items-start gap-2">
                <i data-lucide="alert-circle" class="h-5 w-5 shrink-0"></i>
                <span id="error-text"></span>
            </div>

            <form id="login-form" class="space-y-4">
                <div class="space-y-1.5">
                    <label for="email" class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">E-mail</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="h-5 w-5"></i>
                        </div>
                        <input id="email" name="email" type="email" required placeholder="seuemail@empresa.com"
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50/50 dark:border-slate-800 dark:bg-slate-900/60 pl-11 pr-4 py-3.5 text-sm text-slate-900 dark:text-slate-100 placeholder:text-slate-400 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="password" class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="h-5 w-5"></i>
                        </div>
                        <input id="password" name="password" type="password" required placeholder="••••••••"
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50/50 dark:border-slate-800 dark:bg-slate-900/60 pl-11 pr-4 py-3.5 text-sm text-slate-900 dark:text-slate-100 placeholder:text-slate-400 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
                    </div>
                </div>

                <button id="submit-btn" type="submit"
                    class="w-full rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-sky-500 hover:from-blue-500 hover:to-sky-400 py-3.5 px-4 text-sm font-semibold text-white shadow-xl shadow-blue-500/25 transition duration-200 hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2 mt-2">
                    <span>Entrar</span>
                    <i data-lucide="arrow-right" class="h-4 w-4"></i>
                </button>
            </form>

        </div>
    </main>

    <footer class="w-full text-center text-xs text-slate-400 dark:text-slate-600 pb-safe-bottom">
        &copy; 2026 Acionar - Sistema de Agendamentos Inteligente.
    </footer>

    <script type="module">
        import { supabase } from './js/supabase.js';
        import {
            initTheme,
            ensureActiveProfessionalFromSession,
            registerWebPushSubscription
        } from './js/app.js?v=3.5';

        initTheme();

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const submitBtn = document.getElementById('submit-btn');

        async function checkSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                const activeProf = localStorage.getItem('active_professional');
                if (session || activeProf) {
                    window.location.href = './dashboard.html';
                }
            } catch (err) {
                console.log("Check Session status:", err);
            }
        }

        function showError(msg) {
            if (!msg) {
                errorMessage.classList.add('hidden');
                return;
            }
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            showError('');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
                <span>Entrando...</span>
            `;

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            let authSuccess = false;

            // Nunca reutilize a identidade profissional da sessao anterior.
            // Em dispositivos compartilhados isso vinculava o Push do novo login
            // ao profissional que havia acessado o painel anteriormente.
            localStorage.removeItem('active_professional');

            // 1. Tentar autenticação no Supabase Auth (GoTrue)
            try {
                const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({ email, password });
                if (!authErr && authData?.session) {
                    authSuccess = true;
                }
            } catch (e) {}

            // 2. Se não encontrou no Supabase Auth, tentar via Tabela de Profissionais (Auxiliares cadastrados no painel)
            if (!authSuccess) {
                try {
                    const { data: profData, error: profErr } = await supabase
                        .from('profissionais')
                        .select('*')
                        .eq('email', email)
                        .eq('senha_hash', password)
                        .eq('ativo', true)
                        .maybeSingle();

                    if (profData) {
                        localStorage.setItem('active_professional', JSON.stringify(profData));
                        authSuccess = true;
                    }
                } catch (e) {}
            }

            if (authSuccess) {
                const activeProf = await ensureActiveProfessionalFromSession();
                if (activeProf?.id && 'Notification' in window && Notification.permission === 'granted') {
                    await registerWebPushSubscription().catch((err) => {
                        console.warn('Não foi possível vincular as notificações ao profissional autenticado:', err);
                    });
                }
                window.location.href = './dashboard.html';
            } else {
                showError('E-mail ou senha incorretos. Verifique suas credenciais.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Entrar</span><i data-lucide="arrow-right" class="h-4 w-4"></i>`;
                if (window.lucide) window.lucide.createIcons();
            }
        });

        await checkSession();
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
