<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento - Login</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-white">Painel de Gerenciamento</h1>
            <p class="text-sm text-slate-400 mt-1">Entre com suas credenciais para acessar</p>
        </div>

        <div id="error-message" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/50 rounded-lg text-red-400 text-sm text-center"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">E-mail</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white placeholder-slate-500"
                    placeholder="seu@email.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Senha</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white placeholder-slate-500"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition duration-200 shadow-lg shadow-indigo-600/30 cursor-pointer">
                Entrar
            </button>
        </form>
    </div>

    <script>
        // Substitua pelas suas chaves do projeto Supabase (ou configure variáveis de ambiente se usar build tool)
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';

        // Inicializa o cliente do Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Verifica se já existe uma sessão ativa
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                // Redireciona para o painel interno (ex: dashboard.html) caso já esteja logado
                window.location.href = './dashboard.html';
            }
        }
        checkSession();

        // Manipula o envio do formulário de login
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            const email = emailInput.value;
            const password = passwordInput.value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMessage.textContent = 'Erro ao entrar: ' + error.message;
                errorMessage.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
            } else {
                // Login com sucesso, redireciona para a página interna
                window.location.href = './dashboard.html';
            }
        });
    </script>
</body>
</html>
