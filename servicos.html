<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Acionar - Serviços & Preços</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    spacing: { 'safe-bottom': 'env(safe-area-inset-bottom)', 'safe-top': 'env(safe-area-inset-top)' }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .btn-animated {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-animated:hover {
            transform: translateY(-2px) scale(1.04);
        }
        .btn-animated:active {
            transform: translateY(0) scale(0.96);
        }
    </style>
</head>
<body class="min-h-[100dvh] bg-slate-50 text-slate-800 transition-colors duration-300 dark:bg-[#020617] dark:text-slate-100 flex flex-col">

    <!-- Header Principal -->
    <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 bg-white/80 pt-safe-top backdrop-blur-xl transition-colors duration-300 dark:border-slate-800/80 dark:bg-[#020617]/80">
        <div class="px-4 sm:px-6 py-3.5 max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-white font-black text-lg shadow-md shadow-blue-500/20">
                    A
                </div>
                <div class="flex flex-col">
                    <span class="text-[0.65rem] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Catálogo</span>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white sm:text-xl">Serviços & Preços</h1>
                </div>
            </div>

            <!-- Navegação Desktop & Controles -->
            <div class="flex items-center gap-2 sm:gap-3">
                <nav class="hidden md:flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-2xl border border-slate-200/60 dark:border-slate-800">
                    <a href="./dashboard.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Agenda</a>
                    <a href="./clientes.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Clientes</a>
                    <a href="./servicos.html" class="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-blue-600 text-blue-600 dark:text-white shadow-sm">Serviços</a>
                    <a href="./configuracoes.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Horários</a>
                </nav>

                <button id="theme-toggle" aria-label="Alternar Tema" class="flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 shadow-sm">
                    <svg id="theme-toggle-dark-icon" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    <svg id="theme-toggle-light-icon" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 overflow-y-auto pb-28 md:pb-10">
        <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">

            <!-- Banner do Módulo -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900/60 p-5 sm:p-6 rounded-[2.5rem] shadow-sm border border-slate-200/80 dark:border-slate-800 backdrop-blur-md">
                <div>
                    <span class="text-xs font-extrabold uppercase tracking-wider text-blue-600 dark:text-blue-400">Configuração de Ofertas</span>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-slate-100">Serviços Oferecidos</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Defina durações e tabela de preços para seus atendimentos.</p>
                </div>

                <button id="btnOpenModalServico" class="w-full sm:w-auto flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 px-6 py-3.5 text-sm font-bold text-white shadow-lg shadow-blue-500/25 transition-all transform active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" x2="8.12" y1="4" y2="15.88"/><line x1="14.47" x2="20" y1="14.48" y2="20"/><line x1="8.12" x2="12" y1="8.12" y2="12"/></svg>
                    <span>Novo Serviço</span>
                </button>
            </div>

            <!-- Grid de Serviços -->
            <div id="servicosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Preenchido via Supabase -->
            </div>

        </div>
    </main>

    <!-- MENU INFERIOR MOBILE ULTRA-PREMIUM -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-slate-200/80 bg-white/90 pb-safe-bottom backdrop-blur-2xl dark:border-slate-800/80 dark:bg-[#020617]/95 md:hidden shadow-2xl">
        <div class="flex h-16 items-center justify-around px-2">
            <a href="./dashboard.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl py-1.5 px-3 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-medium transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                <span class="text-[10px] tracking-wide">Agenda</span>
            </a>
            <a href="./clientes.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl py-1.5 px-3 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-medium transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span class="text-[10px] tracking-wide">Clientes</span>
            </a>
            <a href="./servicos.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl py-1.5 px-3 text-blue-600 dark:text-blue-400 font-extrabold bg-blue-500/10 border border-blue-500/20 shadow-sm transition-all scale-105">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" x2="8.12" y1="4" y2="15.88"/><line x1="14.47" x2="20" y1="14.48" y2="20"/><line x1="8.12" x2="12" y1="8.12" y2="12"/></svg>
                <span class="text-[10px] tracking-wide">Serviços</span>
            </a>
            <a href="./configuracoes.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl py-1.5 px-3 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-medium transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span class="text-[10px] tracking-wide">Horários</span>
            </a>
        </div>
    </nav>

    <!-- MODAL DE SERVIÇO -->
    <div id="modalServico" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/70 backdrop-blur-sm hidden p-0 sm:p-4 overflow-y-auto">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-t-[2.5rem] sm:rounded-[2.5rem] w-full max-w-lg p-6 sm:p-8 shadow-2xl space-y-5 my-0 sm:my-auto">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800/80 pb-4">
                <h3 id="modalServicoTitle" class="text-lg font-bold text-slate-900 dark:text-white">Novo Serviço</h3>
                <button id="btnCloseModalServico" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
                </button>
            </div>

            <form id="formServico" class="space-y-4">
                <input type="hidden" id="servicoId">
                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Nome do Serviço</label>
                    <input type="text" id="inputNomeServico" required placeholder="Ex: Corte Masculino" class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Preço (R$)</label>
                    <input type="number" step="0.01" id="inputPrecoServico" required placeholder="50.00" class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Duração (Minutos)</label>
                    <input type="number" id="inputDuracaoServico" required value="30" class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Descrição</label>
                    <textarea id="inputDescricaoServico" rows="2" placeholder="Breve descrição do serviço..." class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-3">
                    <button type="button" id="btnCancelModalServico" class="px-5 py-2.5 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">Cancelar</button>
                    <button type="submit" class="px-6 py-2.5 rounded-full text-xs font-extrabold bg-blue-600 text-white hover:bg-blue-500 shadow-md">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { 
            initTheme, 
            showToast, 
            showConfirmModal,
            showAlertModal,
            fetchServicosAtivos,
            updateServico,
            deleteServico,
            escapeHtml
        } from './js/app.js?v=1.1';
        import { supabase } from './js/supabase.js';

        initTheme();

        const modal = document.getElementById('modalServico');
        const openModalBtn = document.getElementById('btnOpenModalServico');
        const closeModalBtn = document.getElementById('btnCloseModalServico');
        const cancelModalBtn = document.getElementById('btnCancelModalServico');
        const form = document.getElementById('formServico');

        async function renderServicos() {
            const container = document.getElementById('servicosContainer');
            if (!container) return;

            container.innerHTML = `
                <div class="col-span-full flex items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                </div>
            `;

            try {
                const servicos = await fetchServicosAtivos();
                if (!servicos || servicos.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full flex flex-col items-center justify-center py-14 px-4 text-center">
                            <div class="h-14 w-14 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mb-4 dark:bg-slate-800/80 dark:text-slate-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" x2="8.12" y1="4" y2="15.88"/><line x1="14.47" x2="20" y1="14.48" y2="20"/><line x1="8.12" x2="12" y1="8.12" y2="12"/></svg>
                            </div>
                            <h3 class="text-base font-semibold text-slate-800 dark:text-slate-200">Nenhum serviço cadastrado</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-xs">Clique no botão acima para adicionar um novo serviço ao seu catálogo.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                servicos.forEach(servico => {
                    const precoVal = servico.tabela_precos && servico.tabela_precos[0] ? parseFloat(servico.tabela_precos[0].valor) : 0;
                    const preco = `R$ ${precoVal.toFixed(2)}`;

                    const card = document.createElement('div');
                    card.className = 'bg-white dark:bg-slate-900/60 p-5 rounded-[2.5rem] shadow-sm border border-slate-200/80 dark:border-slate-800 backdrop-blur-md flex flex-col justify-between gap-4 animate-fade-in';
                    card.innerHTML = `
                        <div class="space-y-2">
                            <div class="flex items-start justify-between gap-2">
                                <h3 class="font-extrabold text-slate-900 dark:text-white text-base truncate">${escapeHtml(servico.nome)}</h3>
                                <span class="font-black text-emerald-600 dark:text-emerald-400 text-base shrink-0">${preco}</span>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed min-h-[36px]">${escapeHtml(servico.descricao || 'Sem descrição')}</p>
                            <div class="flex items-center gap-1.5 text-xs text-slate-400 font-semibold pt-1">
                                <i class="fa-regular fa-clock text-blue-500"></i>
                                <span>${servico.duracao_minutos} minutos de atendimento</span>
                            </div>
                        </div>

                        <!-- BOTÕES NA HORIZONTAL -->
                        <div class="flex flex-row items-center justify-end gap-1.5 pt-3 border-t border-slate-100 dark:border-slate-800/60">
                            <button class="btn-edit-servico btn-animated flex items-center justify-center h-9 w-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950/40 border border-slate-200/50 dark:border-slate-800" data-servico='${JSON.stringify(servico)}' data-preco="${precoVal}" title="Editar Serviço">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button class="btn-delete-servico btn-animated flex items-center justify-center h-9 w-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 border border-slate-200/50 dark:border-slate-800" data-id="${servico.id}" title="Excluir Serviço">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<div class="col-span-full p-4 text-xs text-rose-500 text-center font-medium">Erro ao carregar serviços: ${err.message}</div>`;
            }
        }

        openModalBtn?.addEventListener('click', () => {
            document.getElementById('servicoId').value = '';
            document.getElementById('modalServicoTitle').textContent = 'Novo Serviço';
            form.reset();
            modal.classList.remove('hidden');
        });

        const closeModal = () => modal.classList.add('hidden');
        closeModalBtn?.addEventListener('click', closeModal);
        cancelModalBtn?.addEventListener('click', closeModal);

        form?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('servicoId').value;
            const nome = document.getElementById('inputNomeServico').value.trim();
            const preco = parseFloat(document.getElementById('inputPrecoServico').value);
            const duracao_minutos = parseInt(document.getElementById('inputDuracaoServico').value);
            const descricao = document.getElementById('inputDescricaoServico').value.trim();

            try {
                if (id) {
                    await updateServico(id, { nome, descricao, duracao_minutos, ativo: true }, preco);
                    showToast('Serviço atualizado!', 'success');
                } else {
                    const { data: newS, error: sErr } = await supabase
                        .from('servicos')
                        .insert([{ nome, descricao, duracao_minutos, ativo: true }])
                        .select()
                        .single();

                    if (sErr) throw sErr;

                    await supabase
                        .from('tabela_precos')
                        .insert([{ servico_id: newS.id, valor: preco }]);

                    showToast('Serviço cadastrado!', 'success');
                }
                closeModal();
                renderServicos();
            } catch (err) {
                showToast('Erro: ' + err.message, 'error');
            }
        });

        const container = document.getElementById('servicosContainer');
        container?.addEventListener('click', async (e) => {
            const btnDelete = e.target.closest('.btn-delete-servico');
            if (btnDelete) {
                const id = btnDelete.dataset.id;
                showConfirmModal({
                    title: 'Excluir Serviço',
                    message: 'Deseja realmente remover este serviço do catálogo?',
                    confirmText: 'Apagar',
                    type: 'danger',
                    onConfirm: async () => {
                        try {
                            await deleteServico(id);
                            showToast('Serviço removido com sucesso!', 'success');
                            renderServicos();
                        } catch (err) {
                            showAlertModal({
                                title: 'Não é possível excluir este serviço',
                                message: err.message,
                                type: 'error'
                            });
                        }
                    }
                });
                return;
            }

            const btnEdit = e.target.closest('.btn-edit-servico');
            if (btnEdit) {
                const servico = JSON.parse(btnEdit.dataset.servico);
                const preco = btnEdit.dataset.preco;
                document.getElementById('servicoId').value = servico.id;
                document.getElementById('inputNomeServico').value = servico.nome;
                document.getElementById('inputPrecoServico').value = preco;
                document.getElementById('inputDuracaoServico').value = servico.duracao_minutos;
                document.getElementById('inputDescricaoServico').value = servico.descricao || '';
                document.getElementById('modalServicoTitle').textContent = 'Editar Serviço';
                modal.classList.remove('hidden');
            }
        });

        renderServicos();
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
