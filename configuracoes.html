<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Acionar - Configurações de Horários</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    spacing: { 'safe-bottom': 'env(safe-area-inset-bottom)', 'safe-top': 'env(safe-area-inset-top)' }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        input[type="time"] { min-height: 44px; }
    </style>
</head>
<body class="min-h-[100dvh] bg-slate-50 text-slate-800 transition-colors duration-300 dark:bg-[#020617] dark:text-slate-100 flex flex-col">

    <!-- Header Principal -->
    <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 bg-white/80 pt-safe-top backdrop-blur-xl transition-colors duration-300 dark:border-slate-800/80 dark:bg-[#020617]/80">
        <div class="px-4 sm:px-6 py-3.5 max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-white font-black text-lg shadow-md shadow-blue-500/20">
                    A
                </div>
                <div class="flex flex-col">
                    <span class="text-[0.65rem] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Parâmetros</span>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white sm:text-xl">Horários de Atendimento</h1>
                </div>
            </div>

            <!-- Navegação Desktop & Controles -->
            <div class="flex items-center gap-2 sm:gap-3">
                <nav class="hidden md:flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-2xl border border-slate-200/60 dark:border-slate-800">
                    <a href="./dashboard.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Agenda</a>
                    <a href="./clientes.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Clientes</a>
                    <a href="./servicos.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Serviços</a>
                    <a href="./configuracoes.html" class="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-blue-600 text-blue-600 dark:text-white shadow-sm">Horários</a>
                </nav>

                <button id="theme-toggle" aria-label="Alternar Tema" class="flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 shadow-sm">
                    <i id="theme-toggle-dark-icon" data-lucide="moon" class="hidden h-5 w-5"></i>
                    <i id="theme-toggle-light-icon" data-lucide="sun" class="hidden h-5 w-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 overflow-y-auto pb-28 md:pb-10">
        <div class="max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">

            <!-- Banner do Módulo -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900/60 p-5 sm:p-6 rounded-[2.5rem] shadow-sm border border-slate-200/80 dark:border-slate-800 backdrop-blur-md">
                <div>
                    <span class="text-xs font-extrabold uppercase tracking-wider text-blue-600 dark:text-blue-400">Expediente Semanal</span>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-slate-100">Turnos & Horários por Dia</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Defina múltiplos turnos de atendimento para cada dia da semana.</p>
                </div>

                <button id="btnReplicarSegunda" type="button" class="flex items-center justify-center gap-2 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-blue-500 hover:text-white dark:hover:bg-blue-600 px-4 py-3 text-xs font-bold transition-all border border-slate-200 dark:border-slate-700">
                    <i data-lucide="copy" class="h-4 w-4"></i>
                    <span>Copiar Segunda (Seg-Sex)</span>
                </button>
            </div>

            <!-- Form de Configurações -->
            <form id="formConfiguracoes" class="space-y-6">
                
                <!-- Intervalo entre Agendamentos -->
                <div class="bg-white dark:bg-slate-900/60 p-5 sm:p-6 rounded-[2.5rem] shadow-sm border border-slate-200/80 dark:border-slate-800 backdrop-blur-md space-y-3">
                    <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">Intervalo Padrão entre Agendamentos</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <label class="flex items-center justify-center p-3 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 text-xs font-bold text-slate-700 dark:text-slate-200 cursor-pointer has-[:checked]:bg-blue-600 has-[:checked]:text-white has-[:checked]:border-blue-600 transition-all">
                            <input type="radio" name="intervalo" value="15" class="sr-only"> 15 minutos
                        </label>
                        <label class="flex items-center justify-center p-3 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 text-xs font-bold text-slate-700 dark:text-slate-200 cursor-pointer has-[:checked]:bg-blue-600 has-[:checked]:text-white has-[:checked]:border-blue-600 transition-all">
                            <input type="radio" name="intervalo" value="30" class="sr-only" checked> 30 minutos
                        </label>
                        <label class="flex items-center justify-center p-3 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 text-xs font-bold text-slate-700 dark:text-slate-200 cursor-pointer has-[:checked]:bg-blue-600 has-[:checked]:text-white has-[:checked]:border-blue-600 transition-all">
                            <input type="radio" name="intervalo" value="45" class="sr-only"> 45 minutos
                        </label>
                        <label class="flex items-center justify-center p-3 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 text-xs font-bold text-slate-700 dark:text-slate-200 cursor-pointer has-[:checked]:bg-blue-600 has-[:checked]:text-white has-[:checked]:border-blue-600 transition-all">
                            <input type="radio" name="intervalo" value="60" class="sr-only"> 60 minutos
                        </label>
                    </div>
                </div>

                <!-- Container de Configuração dos Dias da Semana -->
                <div id="diasSemanaContainer" class="space-y-4">
                    <!-- Preenchido via JS para Segunda a Domingo -->
                </div>

                <!-- Botão de Salvar Flutuante / Fixo -->
                <div class="flex justify-end pt-4">
                    <button type="submit" id="btnSaveConfig" class="w-full sm:w-auto flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 px-8 py-4 text-sm font-extrabold text-white shadow-xl shadow-blue-500/25 transition-transform active:scale-95">
                        <i data-lucide="save" class="h-5 w-5"></i>
                        <span>Salvar Configurações de Horário</span>
                    </button>
                </div>
            </form>

        </div>
    </main>

    <!-- Menu Inferior Mobile -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-slate-200/80 bg-white/90 pb-safe-bottom backdrop-blur-xl dark:border-slate-800/80 dark:bg-[#020617]/90 md:hidden">
        <div class="flex h-16 items-center justify-around px-2">
            <a href="./dashboard.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                <i data-lucide="calendar" class="h-5 w-5"></i>
                <span class="text-[10px]">Agenda</span>
            </a>
            <a href="./clientes.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                <i data-lucide="users" class="h-5 w-5"></i>
                <span class="text-[10px]">Clientes</span>
            </a>
            <a href="./servicos.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                <i data-lucide="scissors" class="h-5 w-5"></i>
                <span class="text-[10px]">Serviços</span>
            </a>
            <a href="./configuracoes.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-blue-600 dark:text-blue-400 font-bold">
                <i data-lucide="clock" class="h-5 w-5"></i>
                <span class="text-[10px]">Horários</span>
            </a>
        </div>
    </nav>

    <!-- Scripts -->
    <script type="module">
        import { initTheme, showToast, fetchConfiguracaoHorarios, saveConfiguracaoHorarios } from './js/app.js';

        initTheme();

        const NORM_DIAS = [
            { key: "1", label: "Segunda-feira" },
            { key: "2", label: "Terça-feira" },
            { key: "3", label: "Quarta-feira" },
            { key: "4", label: "Quinta-feira" },
            { key: "5", label: "Sexta-feira" },
            { key: "6", label: "Sábado" },
            { key: "0", label: "Domingo" }
        ];

        const container = document.getElementById('diasSemanaContainer');
        const form = document.getElementById('formConfiguracoes');
        let currentConfig = null;

        function createTurnoRow(dayKey, turnoData = { inicio: "08:00", fim: "18:00" }, index = 0) {
            const row = document.createElement('div');
            row.className = 'turno-row flex items-center gap-2 flex-wrap sm:flex-nowrap pt-2';
            row.innerHTML = `
                <div class="flex items-center gap-2 flex-1 min-w-[240px]">
                    <div class="flex-1">
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Início</span>
                        <input type="time" class="turno-inicio w-full rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 text-xs font-extrabold text-slate-900 dark:text-white" value="${turnoData.inicio || '08:00'}" required>
                    </div>
                    <span class="text-xs text-slate-400 pt-3">até</span>
                    <div class="flex-1">
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Fim</span>
                        <input type="time" class="turno-fim w-full rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 text-xs font-extrabold text-slate-900 dark:text-white" value="${turnoData.fim || '18:00'}" required>
                    </div>
                </div>
                <button type="button" class="btn-remove-turno self-end mb-0.5 flex items-center justify-center h-9 w-9 rounded-xl bg-rose-500/10 text-rose-500 hover:bg-rose-500/20 transition-colors" title="Remover Turno">
                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                </button>
            `;

            row.querySelector('.btn-remove-turno').addEventListener('click', () => {
                const turnosList = row.parentElement;
                if (turnosList.children.length > 1) {
                    row.remove();
                } else {
                    showToast('O dia precisa ter ao menos um turno configurado.', 'info');
                }
            });

            return row;
        }

        async function loadConfigUI() {
            currentConfig = await fetchConfiguracaoHorarios();

            // Seta intervalo
            const intervalVal = (currentConfig.intervalo_minutos || 30).toString();
            const radioEl = form.querySelector(`input[name="intervalo"][value="${intervalVal}"]`);
            if (radioEl) radioEl.checked = true;

            container.innerHTML = '';

            NORM_DIAS.forEach(d => {
                const dayData = (currentConfig.dias && currentConfig.dias[d.key]) 
                    ? currentConfig.dias[d.key]
                    : {
                        ativo: (currentConfig.dias_semana || [1,2,3,4,5,6]).includes(parseInt(d.key)),
                        turnos: [{ inicio: currentConfig.hora_inicio || "08:00", fim: currentConfig.hora_fim || "18:00" }]
                    };

                const card = document.createElement('div');
                card.className = 'dia-card bg-white dark:bg-slate-900/60 p-5 sm:p-6 rounded-[2.5rem] shadow-sm border border-slate-200/80 dark:border-slate-800 backdrop-blur-md space-y-3';
                card.dataset.dayKey = d.key;

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-800/60 pb-3">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" class="chk-dia h-5 w-5 rounded-lg border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer" ${dayData.ativo ? 'checked' : ''}>
                            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${d.label}</h3>
                        </div>
                        <span class="badge-status-dia text-xs font-bold px-2.5 py-1 rounded-full ${dayData.ativo ? 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'}">
                            ${dayData.ativo ? 'Atendimento Ativo' : 'Fechado'}
                        </span>
                    </div>

                    <div class="turnos-wrapper space-y-2 ${dayData.ativo ? '' : 'opacity-40 pointer-events-none'}">
                        <div class="turnos-list space-y-2"></div>
                        <button type="button" class="btn-add-turno flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-500/10 text-blue-600 dark:text-blue-400 font-bold text-xs hover:bg-blue-500/20 transition-colors mt-2">
                            <i data-lucide="plus" class="h-3.5 w-3.5"></i>
                            <span>Adicionar Turno de Atendimento</span>
                        </button>
                    </div>
                `;

                const chk = card.querySelector('.chk-dia');
                const wrapper = card.querySelector('.turnos-wrapper');
                const badge = card.querySelector('.badge-status-dia');
                const turnosList = card.querySelector('.turnos-list');
                const btnAddTurno = card.querySelector('.btn-add-turno');

                chk.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        wrapper.classList.remove('opacity-40', 'pointer-events-none');
                        badge.className = 'badge-status-dia text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20';
                        badge.textContent = 'Atendimento Ativo';
                    } else {
                        wrapper.classList.add('opacity-40', 'pointer-events-none');
                        badge.className = 'badge-status-dia text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400';
                        badge.textContent = 'Fechado';
                    }
                });

                // Carregar turnos existentes
                const turnos = (dayData.turnos && dayData.turnos.length > 0) 
                    ? dayData.turnos 
                    : [{ inicio: "08:00", fim: "18:00" }];

                turnos.forEach((t, idx) => {
                    turnosList.appendChild(createTurnoRow(d.key, t, idx));
                });

                btnAddTurno.addEventListener('click', () => {
                    turnosList.appendChild(createTurnoRow(d.key, { inicio: "14:00", fim: "18:00" }));
                    if (window.lucide) window.lucide.createIcons();
                });

                container.appendChild(card);
            });

            if (window.lucide) window.lucide.createIcons();
        }

        // Botão para Replicar Segunda-feira para Terça a Sexta
        document.getElementById('btnReplicarSegunda')?.addEventListener('click', () => {
            const mondayCard = container.querySelector('[data-day-key="1"]');
            if (!mondayCard) return;

            const isMondayChecked = mondayCard.querySelector('.chk-dia').checked;
            const mondayTurnos = [];
            mondayCard.querySelectorAll('.turno-row').forEach(row => {
                mondayTurnos.push({
                    inicio: row.querySelector('.turno-inicio').value,
                    fim: row.querySelector('.turno-fim').value
                });
            });

            ["2", "3", "4", "5"].forEach(dayKey => {
                const card = container.querySelector(`[data-day-key="${dayKey}"]`);
                if (card) {
                    const chk = card.querySelector('.chk-dia');
                    chk.checked = isMondayChecked;
                    chk.dispatchEvent(new Event('change'));

                    const turnosList = card.querySelector('.turnos-list');
                    turnosList.innerHTML = '';
                    mondayTurnos.forEach(t => turnosList.appendChild(createTurnoRow(dayKey, t)));
                }
            });

            if (window.lucide) window.lucide.createIcons();
            showToast('Horário da Segunda-feira replicado para Terça a Sexta!', 'info');
        });

        // Salvar Configurações
        form?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const intervalo_minutos = parseInt(form.querySelector('input[name="intervalo"]:checked').value);
            const diasConfig = {};

            container.querySelectorAll('.dia-card').forEach(card => {
                const key = card.dataset.dayKey;
                const ativo = card.querySelector('.chk-dia').checked;
                const turnos = [];

                card.querySelectorAll('.turno-row').forEach(row => {
                    const inicio = row.querySelector('.turno-inicio').value;
                    const fim = row.querySelector('.turno-fim').value;
                    if (inicio && fim) {
                        turnos.push({ inicio, fim });
                    }
                });

                diasConfig[key] = { ativo, turnos };
            });

            const payload = {
                intervalo_minutos,
                dias: diasConfig
            };

            const submitBtn = document.getElementById('btnSaveConfig');
            submitBtn.disabled = true;

            try {
                await saveConfiguracaoHorarios(payload);
                showToast('Configurações de turno salvas com sucesso!', 'success');
            } catch (err) {
                showToast('Erro ao salvar configurações: ' + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        await loadConfigUI();
    </script>
</body>
</html>
