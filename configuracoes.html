<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Acionar - Configuração de Horários & Parâmetros</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    spacing: { 'safe-bottom': 'env(safe-area-inset-bottom)', 'safe-top': 'env(safe-area-inset-top)' }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="min-h-[100dvh] bg-slate-50 text-slate-800 transition-colors duration-300 dark:bg-[#020617] dark:text-slate-100 flex flex-col">

    <!-- Header Principal -->
    <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 bg-white/80 pt-safe-top backdrop-blur-xl transition-colors duration-300 dark:border-slate-800/80 dark:bg-[#020617]/80">
        <div class="px-4 sm:px-6 py-3.5 max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-white font-black text-lg shadow-md shadow-blue-500/20">
                    A
                </div>
                <div class="flex flex-col">
                    <span class="text-[0.65rem] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Parâmetros</span>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white sm:text-xl">Dias & Horários de Atendimento</h1>
                </div>
            </div>

            <!-- Navegação Desktop & Controles -->
            <div class="flex items-center gap-2 sm:gap-3">
                <nav class="hidden md:flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-2xl border border-slate-200/60 dark:border-slate-800">
                    <a href="./dashboard.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Agenda</a>
                    <a href="./clientes.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Clientes</a>
                    <a href="./servicos.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Serviços</a>
                    <a href="./configuracoes.html" class="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-blue-600 text-blue-600 dark:text-white shadow-sm">Horários</a>
                </nav>

                <button id="theme-toggle" aria-label="Alternar Tema" class="flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 shadow-sm">
                    <i id="theme-toggle-dark-icon" data-lucide="moon" class="hidden h-5 w-5"></i>
                    <i id="theme-toggle-light-icon" data-lucide="sun" class="hidden h-5 w-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 overflow-y-auto pb-28 md:pb-10">
        <div class="max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">

            <div class="bg-white dark:bg-slate-900/60 p-6 sm:p-8 rounded-[2.5rem] shadow-sm border border-slate-200/80 dark:border-slate-800 backdrop-blur-md space-y-6">
                <div>
                    <span class="text-xs font-extrabold uppercase tracking-wider text-blue-600 dark:text-blue-400">Expediente</span>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-slate-100">Configurar Expediente de Atendimento</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">Os dias e horários marcados aqui serão os únicos disponíveis para novos agendamentos.</p>
                </div>

                <form id="formConfiguracoes" class="space-y-6">
                    
                    <!-- Dias da Semana -->
                    <div class="space-y-3">
                        <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">Dias de Funcionamento</label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer">
                                <input type="checkbox" name="dias" value="1" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-xs font-semibold text-slate-900 dark:text-white">Segunda-feira</span>
                            </label>
                            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer">
                                <input type="checkbox" name="dias" value="2" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-xs font-semibold text-slate-900 dark:text-white">Terça-feira</span>
                            </label>
                            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer">
                                <input type="checkbox" name="dias" value="3" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-xs font-semibold text-slate-900 dark:text-white">Quarta-feira</span>
                            </label>
                            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer">
                                <input type="checkbox" name="dias" value="4" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-xs font-semibold text-slate-900 dark:text-white">Quinta-feira</span>
                            </label>
                            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer">
                                <input type="checkbox" name="dias" value="5" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-xs font-semibold text-slate-900 dark:text-white">Sexta-feira</span>
                            </label>
                            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer">
                                <input type="checkbox" name="dias" value="6" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-xs font-semibold text-slate-900 dark:text-white">Sábado</span>
                            </label>
                            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer">
                                <input type="checkbox" name="dias" value="0" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-xs font-semibold text-slate-900 dark:text-white">Domingo</span>
                            </label>
                        </div>
                    </div>

                    <!-- Horários e Intervalo -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label for="horaInicio" class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Horário de Abertura</label>
                            <input type="time" id="horaInicio" required class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="horaFim" class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Horário de Fechamento</label>
                            <input type="time" id="horaFim" required class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="intervalo" class="block text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Intervalo de Vagas</label>
                            <select id="intervalo" required class="w-full rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="15">A cada 15 minutos</option>
                                <option value="30">A cada 30 minutos</option>
                                <option value="45">A cada 45 minutos</option>
                                <option value="60">A cada 60 minutos (1 hora)</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex justify-end pt-4 border-t border-slate-100 dark:border-slate-800">
                        <button type="submit" class="flex items-center gap-2 px-8 py-3.5 rounded-2xl text-sm font-extrabold bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:from-blue-500 hover:to-indigo-500 shadow-lg shadow-blue-500/25 transition-transform active:scale-95">
                            <i data-lucide="save" class="h-4 w-4"></i>
                            <span>Salvar Configurações</span>
                        </button>
                    </div>
                </form>

            </div>

        </div>
    </main>

    <!-- Menu Inferior Mobile -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-slate-200/80 bg-white/90 pb-safe-bottom backdrop-blur-xl dark:border-slate-800/80 dark:bg-[#020617]/90 md:hidden">
        <div class="flex h-16 items-center justify-around px-2">
            <a href="./dashboard.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                <i data-lucide="calendar" class="h-5 w-5"></i>
                <span class="text-[10px]">Agenda</span>
            </a>
            <a href="./clientes.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                <i data-lucide="users" class="h-5 w-5"></i>
                <span class="text-[10px]">Clientes</span>
            </a>
            <a href="./servicos.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                <i data-lucide="scissors" class="h-5 w-5"></i>
                <span class="text-[10px]">Serviços</span>
            </a>
            <a href="./configuracoes.html" class="flex flex-1 flex-col items-center justify-center gap-1 rounded-2xl p-2 text-blue-600 dark:text-blue-400 font-bold">
                <i data-lucide="clock" class="h-5 w-5"></i>
                <span class="text-[10px]">Horários</span>
            </a>
        </div>
    </nav>

    <!-- Scripts -->
    <script type="module">
        import { initTheme, showToast, fetchConfiguracaoHorarios, saveConfiguracaoHorarios } from './js/app.js';

        initTheme();

        const form = document.getElementById('formConfiguracoes');
        const horaInicioInput = document.getElementById('horaInicio');
        const horaFimInput = document.getElementById('horaFim');
        const intervaloSelect = document.getElementById('intervalo');

        async function loadConfig() {
            const config = await fetchConfiguracaoHorarios();
            horaInicioInput.value = config.hora_inicio || '08:00';
            horaFimInput.value = config.hora_fim || '18:00';
            intervaloSelect.value = config.intervalo_minutos || 30;

            const diasAtivos = config.dias_semana || [1, 2, 3, 4, 5, 6];
            document.querySelectorAll('input[name="dias"]').forEach(chk => {
                chk.checked = diasAtivos.includes(parseInt(chk.value));
            });
        }

        form?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const dias = Array.from(document.querySelectorAll('input[name="dias"]:checked')).map(chk => parseInt(chk.value));
            if (dias.length === 0) {
                showToast('Selecione pelo menos um dia de atendimento.', 'error');
                return;
            }

            const configValor = {
                dias_semana: dias,
                hora_inicio: horaInicioInput.value,
                hora_fim: horaFimInput.value,
                intervalo_minutos: parseInt(intervaloSelect.value)
            };

            try {
                await saveConfiguracaoHorarios(configValor);
                showToast('Horários de atendimento salvos com sucesso!', 'success');
            } catch (err) {
                showToast('Erro ao salvar horários: ' + err.message, 'error');
            }
        });

        await loadConfig();
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
